<html noscrollbar>
	<body>
		<table width=700>
			<tr>
				<td height=10></td>
			</tr>
		</table>
		<table width=20>
			<tr>
				<td>
					%navigation%
				</td>
				<td>
					<center>
						<table border=0 cellpadding=0 cellspacing=0 width=555 height=455 background="L2UI_CT1.Windows_DF_TooltipBG">
							<tr>
								<td height=15></td>
							</tr>
							<tr>
								<td align="center"><font name="hs12" color="CDB67F">Добро пожаловать, %player_name%!</font></td>
							</tr>
							<tr>
								<td height=10></td>
							</tr>
							<tr>
								<td align="center"><font color="908899">Сейчас в игре: <font color="LEVEL">%online%</font> игроков</font></td>
							</tr>
							<tr>
								<td height=15></td>
							</tr>
							<tr>
								<td>
									<center><img src="L2UI.SquareGray" width=200 height=1></center>
								</td>
							</tr>
							<tr>
								<td height=15></td>
							</tr>
							<tr>
								<td align="center">
									<table align=center border=0 cellspacing=6>
										<tr>
											<td><button value="Бафер" action="bypass _bbstop;buffer/main.html" width=130 height=30 back="L2UI_CT1.OlympiadWnd_DF_Fight3None_Down" fore="L2UI_CT1.OlympiadWnd_DF_Fight3None"></td>
											<td><button value="Телепорт" action="bypass _bbstop;gatekeeper/main.html" width=130 height=30 back="L2UI_CT1.OlympiadWnd_DF_HeroConfirm_Down" fore="L2UI_CT1.OlympiadWnd_DF_HeroConfirm"></td>
											<td><button value="Магазин" action="bypass _bbstop;merchant/main.html" width=130 height=30 back="L2UI_CT1.OlympiadWnd_DF_BuyEquip_Down" fore="L2UI_CT1.OlympiadWnd_DF_BuyEquip"></td>
										</tr>
										<tr>
											<td><button value="Рейтинг" action="bypass _bbsrank;pvp" width=130 height=30 back="L2UI_CT1.OlympiadWnd_DF_Watch_Down" fore="L2UI_CT1.OlympiadWnd_DF_Watch"></td>
											<td><button value="Профессия" action="bypass _bbsclass" width=130 height=30 back="L2UI_CT1.OlympiadWnd_DF_Fight1None_Down" fore="L2UI_CT1.OlympiadWnd_DF_Fight1None"></td>
											<td><button value="Информация" action="bypass _bbstop;info/main.html" width=130 height=30 back="L2UI_CT1.OlympiadWnd_DF_GrandConfirm_Down" fore="L2UI_CT1.OlympiadWnd_DF_GrandConfirm"></td>
										</tr>
									</table>
								</td>
							</tr>
							<tr>
								<td height=15></td>
							</tr>
							<tr>
								<td>
									<center><img src="L2UI.SquareGray" width=500 height=1></center>
								</td>
							</tr>
							<tr>
								<td height=10></td>
							</tr>
							<tr>
								<td align="center">
									<font color="908899">Alt+B — Комьюнити-борд всегда под рукой</font>
									<br1>
									<font color="696969">Бафы, схемы, телепорт, магазин, рейтинг — всё в несколько кликов</font>
								</td>
							</tr>
						</table>
					</center>
				</td>
			</tr>
		</table>
	</body>
</html>
